<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Birthday Premiere</title>
<style>
  :root{--pink:#ff5c9d;--violet:#8b5cf6;--cyan:#38e8ff;--bar:9vh}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;overflow:hidden;background:#05030c;color:#f6f1ff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center}

  /* aurora */
  .bg{position:fixed;inset:-25%;filter:blur(90px);opacity:.85;pointer-events:none}
  .bg i{position:absolute;border-radius:50%;mix-blend-mode:screen}
  .bg i:nth-child(1){width:60vmax;height:60vmax;left:-15%;top:-20%;
    background:radial-gradient(circle,#ff5c9d,transparent 62%);animation:d1 26s ease-in-out infinite alternate}
  .bg i:nth-child(2){width:55vmax;height:55vmax;right:-15%;top:5%;
    background:radial-gradient(circle,#8b5cf6,transparent 62%);animation:d2 32s ease-in-out infinite alternate}
  .bg i:nth-child(3){width:50vmax;height:50vmax;left:20%;bottom:-25%;
    background:radial-gradient(circle,#38e8ff,transparent 60%);opacity:.7;animation:d3 38s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(12vw,8vh) scale(1.15)}}
  @keyframes d2{to{transform:translate(-10vw,12vh) scale(.95)}}
  @keyframes d3{to{transform:translate(8vw,-10vh) scale(1.2)}}

  /* grain + vignette + bars */
  .grain{position:fixed;inset:-10%;opacity:.075;pointer-events:none;z-index:20;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    animation:g .7s steps(3) infinite}
  @keyframes g{20%{transform:translate(-3%,4%)}40%{transform:translate(4%,-3%)}60%{transform:translate(-2%,-4%)}80%{transform:translate(3%,3%)}}
  .vig{position:fixed;inset:0;pointer-events:none;z-index:15;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75))}
  .bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:10;animation:b 1s cubic-bezier(.7,0,.2,1) .15s forwards}
  .bar.t{top:0}.bar.b{bottom:0}
  @keyframes b{to{height:var(--bar)}}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:8}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
  .flash.fire{animation:f .7s ease-out forwards}
  @keyframes f{12%{opacity:.9}100%{opacity:0}}

  /* lock card */
  .lock{position:relative;z-index:5;width:min(92vw,430px);padding:2.6rem 2rem 2rem;
    border-radius:30px;text-align:center;transition:opacity .55s,transform .8s cubic-bezier(.7,0,.2,1),filter .55s;
    background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 40px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.18);
    animation:in 1.1s cubic-bezier(.2,.9,.2,1) .25s both}
  @keyframes in{from{opacity:0;transform:translateY(34px) scale(.95);filter:blur(8px)}}
  .lock.out{opacity:0;transform:scale(1.12) translateY(-14px);filter:blur(12px);pointer-events:none}

  .eyebrow{font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;font-weight:600;margin-bottom:1rem;
    background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin:0 0 .5rem;font-size:clamp(1.5rem,5.5vw,1.9rem);letter-spacing:-.02em}
  .sub{margin:0 0 1.9rem;font-size:.9rem;color:rgba(246,241,255,.55);line-height:1.55}

  .pin{display:flex;gap:.7rem;justify-content:center;margin-bottom:1.1rem}
  .pin.shake{animation:s .45s cubic-bezier(.36,.07,.19,.97)}
  @keyframes s{20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
  .pin input{width:clamp(3rem,15vw,3.6rem);height:clamp(3.8rem,18vw,4.4rem);
    border-radius:17px;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);
    color:#fff;font:700 1.7rem/1 inherit;text-align:center;outline:none;caret-color:var(--pink);
    transition:border-color .22s,box-shadow .22s,background .22s,transform .22s}
  .pin input:focus{border-color:var(--pink);background:rgba(255,92,157,.09);transform:translateY(-3px);
    box-shadow:0 0 0 4px rgba(255,92,157,.14),0 0 26px rgba(255,92,157,.4)}
  .pin input.filled{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.11)}
  .pin input.wrong{border-color:#ff4d6d;background:rgba(255,77,109,.14)}

  .err{min-height:1.3rem;font-size:.85rem;color:#ff8fa3;opacity:0;transition:.25s}
  .err.show{opacity:1}
  .hint{margin-top:.9rem;font-size:.78rem;color:rgba(246,241,255,.35)}

  /* reveal */
  .reveal{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:calc(var(--bar) + 1rem) 1.25rem;
    opacity:0;pointer-events:none;transition:opacity .8s ease .15s}
  .reveal.show{opacity:1;pointer-events:auto}
  .glow{position:absolute;width:min(90vw,700px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(255,92,157,.35),rgba(139,92,246,.22) 38%,transparent 68%);
    filter:blur(50px);opacity:0;transform:scale(.6)}
  .reveal.show .glow{animation:gi 2.4s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes gi{to{opacity:1;transform:scale(1)}}
  .inner{position:relative;text-align:center;max-width:620px}
  .r-eyebrow{font-size:.7rem;letter-spacing:.42em;text-transform:uppercase;font-weight:600;
    color:rgba(246,241,255,.55);opacity:0}
  .reveal.show .r-eyebrow{animation:fu .9s cubic-bezier(.2,.9,.2,1) .25s forwards}
  .r-title{margin:.9rem 0 1.4rem;font-family:Georgia,serif;font-weight:700;
    font-size:clamp(2.7rem,11vw,6rem);line-height:.94;letter-spacing:-.025em;perspective:800px}
  .r-title span{display:block;opacity:0;transform:translateY(46px) rotateX(35deg);
    background:linear-gradient(100deg,#fff 0%,#ffc4dd 18%,#ff5c9d 38%,#a78bfa 58%,#38e8ff 78%,#fff 100%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
  .reveal.show .r-title span{animation:li 1s cubic-bezier(.2,.9,.2,1) forwards,sh 7s linear infinite}
  .reveal.show .r-title span:nth-child(1){animation-delay:.4s,.4s}
  .reveal.show .r-title span:nth-child(2){animation-delay:.58s,.58s}
  @keyframes li{to{opacity:1;transform:none}}
  @keyframes sh{to{background-position:250% 50%}}
  .r-sub{margin:0 auto;max-width:500px;font-size:clamp(.98rem,2.6vw,1.12rem);line-height:1.75;
    color:rgba(246,241,255,.72);opacity:0}
  .reveal.show .r-sub{animation:fu 1s cubic-bezier(.2,.9,.2,1) .85s forwards}
  @keyframes fu{to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.grain{display:none}}
</style>
</head>
<body>

<div class="bg"><i></i><i></i><i></i></div>
<canvas id="confetti"></canvas>
<div class="bar t"></div><div class="bar b"></div>
<div class="vig"></div><div class="grain"></div>
<div class="flash" id="flash"></div>

<section class="lock" id="lock">
  <div class="eyebrow">A Private Premiere</div>
  <h1>Enter the code</h1>
  <p class="sub">Four digits to unlock your surprise.</p>
  <div class="pin" id="pin">
    <input type="tel" inputmode="numeric" maxlength="1" aria-label="Digit 1">
    <input type="tel" inputmode="numeric" maxlength="1" aria-label="Digit 2">
    <input type="tel" inputmode="numeric" maxlength="1" aria-label="Digit 3">
    <input type="tel" inputmode="numeric" maxlength="1" aria-label="Digit 4">
  </div>
  <div class="err" id="err" role="alert"></div>
  <div class="hint">Hint: you already know it 😉</div>
</section>

<section class="reveal" id="reveal">
  <div class="glow"></div>
  <div class="inner">
    <div class="r-eyebrow">Today Is The Day</div>
    <h1 class="r-title"><span>Happy</span><span>Birthday</span></h1>
    <p class="r-sub" id="msg"></p>
  </div>
</section>

<script>
(function(){
  const PIN = "8639";
  const MSG = "Another trip around the sun, and you keep getting better at it. Here's to a year of good chaos, loud laughter, and every little thing that makes you smile. 🥳";

  const $ = id => document.getElementById(id);
  const lock = $("lock"), pin = $("pin"), err = $("err"),
        reveal = $("reveal"), flash = $("flash"), msg = $("msg");
  const inputs = [...pin.querySelectorAll("input")];
  const canvas = $("confetti"), ctx = canvas.getContext("2d");

  msg.textContent = MSG;

  /* ---- PIN input ---- */
  let locked = true;
  inputs.forEach((el, i) => {
    el.addEventListener("focus", () => el.select());
    el.addEventListener("input", () => {
      el.value = el.value.replace(/\D/g, "").slice(0, 1);
      el.classList.toggle("filled", !!el.value);
      el.classList.remove("wrong");
      err.classList.remove("show");
      if (el.value && i < 3) inputs[i + 1].focus();
      if (inputs.every(x => x.value)) { locked = false; setTimeout(check, 180); }
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !el.value && i > 0) {
        inputs[i - 1].value = ""; inputs[i - 1].classList.remove("filled"); inputs[i - 1].focus();
      }
      if (e.key === "Enter") check();
    });
    el.addEventListener("paste", e => {
      e.preventDefault();
      const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4);
      t.split("").forEach((ch, j) => { if (inputs[j]) { inputs[j].value = ch; inputs[j].classList.add("filled"); } });
      inputs[Math.min(t.length, 3)].focus();
      if (t.length === 4) { locked = false; setTimeout(check, 180); }
    });
  });

  function check(){
    if (locked) return;
    if (inputs.map(x => x.value).join("") === PIN) success();
    else fail();
  }

  function fail(){
    pin.classList.add("shake");
    inputs.forEach(i => i.classList.add("wrong"));
    err.textContent = "Not quite. Try again."; err.classList.add("show");
    setTimeout(() => {
      pin.classList.remove("shake");
      inputs.forEach(i => { i.value = ""; i.classList.remove("wrong", "filled"); });
      inputs[0].focus(); locked = true;
    }, 520);
  }

  function success(){
    flash.classList.add("fire");
    lock.classList.add("out");
    setTimeout(() => { lock.style.display = "none"; reveal.classList.add("show"); burst(); }, 480);
    setTimeout(burst, 1100);
  }

  /* ---- confetti ---- */
  let W, H, DPR, raf = null, pieces = [];
  function size(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  size(); addEventListener("resize", size);

  const COLORS = ["#ff5c9d","#ffd166","#38e8ff","#8b5cf6","#7bffb2","#ff8a5c","#fff"];
  function piece(x, y, vx, vy){
    return { x, y, vx, vy, w: 6 + Math.random()*8, h: 8 + Math.random()*11,
      c: COLORS[(Math.random()*COLORS.length)|0],
      rot: Math.random()*6.28, vr: (Math.random()-.5)*.35,
      g: .42 + Math.random()*.16, drag: .991, phase: Math.random()*6.28,
      circle: Math.random() < .28 };
  }

  function burst(){
    for (let i = 0; i < 90; i++){
      const L = Math.random() < .5, sx = 13 + Math.random()*21;
      pieces.push(piece(L ? -12 : W + 12, H*(.68 + Math.random()*.3),
        L ? sx : -sx, -(15 + Math.random()*21)));
    }
    for (let i = 0; i < 55; i++){
      pieces.push(piece(Math.random()*W, -30 - Math.random()*220, (Math.random()-.5)*4, 2 + Math.random()*4));
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function tick(){
    ctx.clearRect(0, 0, W, H);
    for (let i = pieces.length - 1; i >= 0; i--){
      const p = pieces[i];
      p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag;
      p.vx += Math.sin(p.y*.012 + p.phase) * .07;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > H + 90 || p.x < -140 || p.x > W + 140){ pieces.splice(i, 1); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.circle){ ctx.beginPath(); ctx.arc(0, 0, p.w*.45, 0, 6.29); ctx.fill(); }
      else ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    raf = pieces.length ? requestAnimationFrame(tick) : null;
  }

  reveal.addEventListener("click", () => { if (reveal.classList.contains("show")) burst(); });
  inputs[0].focus();
})();
</script>
</body>
</html>
