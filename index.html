<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXORA STUDIOS | Digital Store</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #050508;
            --card-bg: rgba(20, 20, 25, 0.85);
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.6);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            perspective: 1000px; /* Enables 3D space */
        }

        /* --- 3D Floating Background Orbs --- */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.5;
            animation: floatOrb 15s infinite ease-in-out alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: #3b82f6; top: -10%; left: -10%; }
        .orb-2 { width: 250px; height: 250px; background: #8b5cf6; bottom: 10%; right: -5%; animation-delay: -5s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.2); }
        }

        /* --- Top Stats Bar --- */
        .top-stats-bar {
            display: flex; justify-content: flex-end; align-items: center;
            padding: 10px 5%; background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; color: var(--text-muted);
            z-index: 101;
        }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .stat-item i { color: var(--accent-blue); text-shadow: 0 0 10px var(--accent-glow); }

        /* --- Navigation --- */
        .navbar {
            position: sticky; top: 0; width: 100%; padding: 15px 5%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 8, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color); z-index: 100; gap: 15px;
        }

        .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.3rem; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: var(--accent-blue); text-shadow: 0 0 15px var(--accent-glow); }
        
        .search-container { flex-grow: 1; position: relative; }
        .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem;}
        .search-container input {
            width: 100%; padding: 12px 15px 12px 40px; border-radius: 50px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: white;
            font-size: 0.85rem; font-family: 'Inter', sans-serif; transition: all 0.3s ease; outline: none;
        }
        .search-container input:focus { border-color: var(--accent-blue); background: rgba(255,255,255,0.1); }

        /* --- Hero Section --- */
        .hero { text-align: center; padding: 50px 20px 30px; max-width: 800px; margin: 0 auto; }
        .badge {
            display: inline-block; padding: 6px 14px; border-radius: 50px;
            background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase;
        }
        .hero h2 { 
            font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); 
            font-weight: 800; line-height: 1.1; margin-bottom: 15px;
        }
        .hero h2 span { background: linear-gradient(to right, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-muted); font-size: 0.95rem; max-width: 400px; margin: 0 auto; }

        /* --- 3D Product Grid --- */
        .grid { 
            display: grid; grid-template-columns: 1fr; /* Single column on mobile for maximum 3D impact */
            gap: 30px; max-width: 1200px; margin: 0 auto 60px; padding: 0 20px; width: 100%; flex-grow: 1;
            perspective: 1000px;
        }
        
        /* --- 3D Floating Cards --- */
        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 20px; 
            display: flex; flex-direction: column; 
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            /* Auto-Floating 3D Animation */
            animation: floatCard 6s infinite ease-in-out alternate;
        }

        /* Stagger the floating animation for each card */
        .card:nth-child(even) { animation-delay: -3s; }

        @keyframes floatCard {
            0% { transform: translateY(0px) rotateX(0deg) rotateY(0deg); }
            100% { transform: translateY(-15px) rotateX(2deg) rotateY(-2deg); }
        }

        /* Physical press down on mobile tap */
        .card:active { 
            transform: scale(0.98) translateY(0px); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            transition: all 0.1s;
        }

        /* Image Container */
        .image-wrapper { 
            width: 100%; height: 200px; overflow: hidden; border-radius: 20px 20px 0 0; 
            position: relative; border-bottom: 1px solid var(--border-color);
        }
        .card-image { width: 100%; height: 100%; object-fit: cover; }
        
        .image-wrapper::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to top, var(--card-bg), transparent);
        }

        /* Share Button */
        .share-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2); color: white;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
        }
        .share-btn:active { background: var(--accent-blue); }
        
        /* Card Content */
        .card-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .card h3 { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0 0 10px 0; font-size: 1.2rem; font-weight: 800; }
        .description { 
            color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; margin-bottom: 20px; flex-grow: 1; 
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .price-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .price { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: #60a5fa; font-size: 1.5rem; text-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        /* 3D Push Button */
        .buy-btn { 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 14px; 
            text-decoration: none; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; 
            font-weight: 800; font-size: 0.95rem; letter-spacing: 1px;
            transition: all 0.1s ease; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 6px 0 #1e40af, 0 8px 15px rgba(0,0,0,0.4); /* 3D bottom edge */
        }
        
        .buy-btn:active { 
            transform: translateY(6px); 
            box-shadow: 0 0px 0 #1e40af, 0 2px 5px rgba(0,0,0,0.4);
        }

        /* --- Empty State --- */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: var(--border-color); }

        /* --- Footer --- */
        .footer { text-align: center; padding: 40px 20px; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.5); }
        .footer p { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 15px; }
        .footer a {
            display: inline-flex; align-items: center; gap: 10px; color: white; text-decoration: none; font-weight: 600;
            padding: 12px 24px; border-radius: 50px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .footer a:active { background: rgba(255,255,255,0.1); }
        .footer a i { color: #25D366; font-size: 1.2rem; }

        /* --- Desktop Enhancements (Tablets & PCs) --- */
        @media (min-width: 768px) {
            .navbar { padding: 20px 5%; }
            .logo { font-size: 1.5rem; }
            .search-container { max-width: 400px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
            .card-image { height: 220px; }
            .card h3 { font-size: 1.4rem; }
            .price { font-size: 1.8rem; }
            
            /* Hover effects only for desktop */
            .card:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.5); }
            .share-btn:hover { background: var(--accent-blue); transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="top-stats-bar">
        <div class="stat-item" id="product-counter">
            <i class="fa-solid fa-box"></i> Loading products...
        </div>
    </div>

    <nav class="navbar">
        <div class="logo">NEX<span>O</span>RA</div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search products...">
        </div>
    </nav>

    <section class="hero">
        <div class="badge">Nexora Studios</div>
        <h2>Ideas. Designed <span>Digitally.</span></h2>
        <p>Premium digital assets and tools curated for creators, students, and professionals.</p>
    </section>

    <div class="grid" id="product-grid">
        <!-- Skeletons -->
        <div class="skeleton-card" style="height:380px; background:#121215; border-radius:20px;"></div>
        <div class="skeleton-card" style="height:380px; background:#121215; border-radius:20px;"></div>
    </div>

    <footer class="footer">
        <p>© <span id="year"></span> NEXORA STUDIOS. All rights reserved.</p>
        <a href="https://whatsapp.com/channel/0029Vb8TEO2FSAt0DnFycN0c" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp Channel
        </a>
    </footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        let allProducts = [];
        const grid = document.getElementById('product-grid');
        
        // 🚨 YOUR SHEET ID
        const SHEET_ID = '19W33pFurvp8OHdVYSzcBsH2xjML6p5PStGCZeUblIsM'; 
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

        const hash = window.location.hash.substring(1); 
        const urlParams = new URLSearchParams(hash);
        const productLinkId = urlParams.get('product');

        async function loadProducts() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();

                Papa.parse(csvText, {
                    header: true, 
                    skipEmptyLines: true,
                    transformHeader: function(header) { return header.trim().toLowerCase(); },
                    complete: function(results) {
                        const today = new Date();
                        today.setHours(0,0,0,0);

                        allProducts = results.data.filter(product => {
                            if (!product.expiry || product.expiry.trim() === '') return true;
                            const expiryDate = new Date(product.expiry);
                            if (isNaN(expiryDate.getTime())) return true; 
                            return today <= expiryDate;
                        });
                        
                        document.getElementById('product-counter').innerHTML = `<i class="fa-solid fa-box"></i> ${allProducts.length} Products`;

                        if (productLinkId) {
                            const filtered = allProducts.filter(p => {
                                const cleanName = (p.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
                                return cleanName === productLinkId;
                            });
                            
                            if (filtered.length > 0) {
                                document.getElementById('searchInput').value = filtered[0].name;
                                renderProducts(filtered);
                                return;
                            }
                        }
                        renderProducts(allProducts);
                    }
                });
            } catch (error) {
                console.error('Error:', error);
                grid.innerHTML = '<p style="color:red; text-align:center; grid-column:1/-1;">Error loading store.</p>';
            }
        }

        function renderProducts(products) {
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-box-open"></i>
                        <h3>No products found</h3>
                        <p>Try searching for something else.</p>
                    </div>
                `;
                return;
            }

            products.forEach((product, index) => {
                let selarLink = product['selar link'] ? product['selar link'].trim() : '#';
                const rawPrice = product['price usd'];
                const formattedPrice = rawPrice && rawPrice.trim() !== '' ? `$${rawPrice}` : 'Free';

                let imgUrl = product.image ? product.image.trim() : '';
                if (imgUrl.includes('drive.google.com')) {
                    const fileId = imgUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (fileId && fileId[1]) imgUrl = `https://drive.google.com/uc?export=view&id=${fileId[1]}`;
                }
                const fallbackImage = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop';
                if (!imgUrl) imgUrl = fallbackImage;

                const cleanName = (product.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
                const storeLink = `${window.location.origin}${window.location.pathname}#product=${cleanName}`;

                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${imgUrl}" alt="${product.name}" class="card-image" onerror="this.src='${fallbackImage}'">
                        <div class="share-btn" onclick="shareProduct('${storeLink}', event)">
                            <i class="fa-solid fa-link"></i>
                        </div>
                    </div>
                    <div class="card-content">
                        <h3>${product.name || 'Untitled Product'}</h3>
                        <p class="description">${product.description || 'No description available.'}</p>
                        <div class="price-row">
                            <div class="price">${formattedPrice}</div>
                        </div>
                        <a href="${selarLink}" target="_blank" class="buy-btn">
                            Buy Now
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function shareProduct(link, event) {
            event.stopPropagation();
            navigator.clipboard.writeText(link).then(() => {
                const btn = event.currentTarget;
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check" style="color: #4ade80;"></i>';
                setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
            }).catch(err => alert('Could not copy link: ' + link));
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredProducts = allProducts.filter(product => {
                const name = (product.name || '').toLowerCase();
                const desc = (product.description || '').toLowerCase();
                return name.includes(searchTerm) || desc.includes(searchTerm);
            });
            renderProducts(filteredProducts);
        });

        loadProducts();
    </script>
</body>
</html>
