<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Sir Jacob 🎂</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#eaf3ff,#f4ecff 55%,#fff0f6);color:#1f2a44}
  .card{width:min(92vw,390px);padding:2.2rem 1.75rem;border-radius:26px;text-align:center;
    background:#fff;box-shadow:0 18px 50px rgba(60,90,160,.16);
    transition:opacity .4s,transform .4s}
  .card.out{opacity:0;transform:scale(.94);pointer-events:none}
  .big{font-size:2.8rem;margin-bottom:.4rem}
  h1{margin:0 0 .4rem;font-size:1.3rem}
  p{margin:0 0 1.5rem;font-size:.9rem;color:#5c6784;line-height:1.55}
  .pin{display:flex;gap:.6rem;justify-content:center;margin-bottom:.8rem}
  .pin.shake{animation:s .4s}
  @keyframes s{20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
  .pin input{width:3.4rem;height:3.9rem;border-radius:14px;border:2px solid #dde6f5;
    background:#f8fbff;font:700 1.5rem/1 inherit;color:#1f2a44;text-align:center;outline:none;transition:.18s}
  .pin input:focus{border-color:#4f8cff;background:#eef5ff;transform:translateY(-2px);
    box-shadow:0 0 0 4px rgba(79,140,255,.18)}
  .pin input.wrong{border-color:#ff6b81;background:#fff0f2}
  .err{min-height:1.2rem;font-size:.82rem;color:#e0455f;opacity:0;transition:.2s}
  .err.show{opacity:1}
  .reveal{display:none}
  .reveal.show{display:block;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{opacity:0;transform:scale(.9)}}
  .reveal h1{font-size:1.55rem;margin-bottom:.7rem;
    background:linear-gradient(90deg,#4f8cff,#8b5cf6);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .reveal p{font-size:.94rem;color:#3d4966;margin-bottom:0}
  .sign{margin-top:1.1rem;font-size:.82rem;color:#8b95ad;font-style:italic}
</style>
</head>
<body>
<div class="card" id="card">
  <div id="lockView">
    <div class="big">🎁</div>
    <h1>A little something for Sir Jacob</h1>
    <p>Enter the 4-digit code to open it.</p>
    <div class="pin" id="pin">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="1">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="2">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="3">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="4">
    </div>
    <div class="err" id="err" role="alert"></div>
  </div>
  <div class="reveal" id="reveal">
    <div class="big">🎂</div>
    <h1>Happy Birthday, Sir Jacob!</h1>
    <p id="msg"></p>
    <div class="sign" id="sign"></div>
  </div>
</div>
<div id="rain" style="position:fixed;inset:0;pointer-events:none;overflow:hidden"></div>

<script>
const PIN  = "8639";
const MSG  = "Thank you for your patience, your wisdom, and for making every lesson count. " +
             "May this new year bring you good health, peace, and plenty of reasons to smile. " +
             "Enjoy your day, sir — you've earned it. 🎉";
const SIGN = "— with respect and gratitude, from all of us";

document.getElementById("msg").textContent  = MSG;
document.getElementById("sign").textContent = SIGN;

const inputs = [...document.querySelectorAll(".pin input")];
const pin = document.getElementById("pin"), err = document.getElementById("err");
let busy = false;

inputs.forEach((el, i) => {
  el.addEventListener("focus", () => el.select());
  el.addEventListener("input", () => {
    el.value = el.value.replace(/\D/g, "").slice(0, 1);
    el.classList.remove("wrong"); err.classList.remove("show");
    if (el.value && i < 3) inputs[i + 1].focus();
    if (!busy && inputs.every(x => x.value)) check();
  });
  el.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !el.value && i > 0) {
      inputs[i - 1].value = ""; inputs[i - 1].focus();
    }
  });
});

function check() {
  busy = true;
  setTimeout(() => {
    if (inputs.map(x => x.value).join("") === PIN) unlock();
    else {
      pin.classList.add("shake");
      inputs.forEach(i => i.classList.add("wrong"));
      err.textContent = "That's not it — try again."; err.classList.add("show");
      setTimeout(() => {
        pin.classList.remove("shake");
        inputs.forEach(i => { i.value = ""; i.classList.remove("wrong"); });
        inputs[0].focus(); busy = false;
      }, 500);
    }
  }, 150);
}

function unlock() {
  document.getElementById("card").classList.add("out");
  setTimeout(() => {
    document.getElementById("lockView").style.display = "none";
    document.getElementById("card").classList.remove("out");
    document.getElementById("reveal").classList.add("show");
    rain();
  }, 400);
}

function rain() {
  const box = document.getElementById("rain");
  const emo = ["🎉","🎂","🎈","✨","🥳","📚"];
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("span");
    s.textContent = emo[(Math.random() * emo.length) | 0];
    s.style.cssText = `position:absolute;left:${Math.random()*100}%;top:-40px;
      font-size:${16 + Math.random()*22}px;opacity:.9;
      animation:fall ${2.5 + Math.random()*2.5}s linear ${Math.random()*1.5}s forwards`;
    box.appendChild(s);
  }
}
const style = document.createElement("style");
style.textContent = "@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:0}}";
document.head.appendChild(style);
inputs[0].focus();
</script>
</body>
</html>
